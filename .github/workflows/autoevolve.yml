name: autoevolve

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, the shortest interval GitHub allows; runs may be delayed or skipped
  workflow_dispatch:        # manual runs always allowed

permissions:
  contents: write           # push to the autoevolve branch; nothing else

concurrency:
  group: autoevolve         # one run at a time; a waiting run never cancels a running one
  cancel-in-progress: false

jobs:
  evolve:
    # No on/off variable: to pause, disable this workflow in the Actions tab.
    runs-on: ubuntu-latest
    timeout-minutes: 3      # a stuck run must not hold up the queue
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch to the autoevolve branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin autoevolve > /dev/null 2>&1; then
            git checkout -B autoevolve origin/autoevolve
          else
            git checkout -B autoevolve "origin/$DEFAULT_BRANCH"
          fi

      - name: Copy symbolic-ai.lisp from the default branch (so new lessons you add there are picked up)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout "origin/$DEFAULT_BRANCH" -- symbolic-ai.lisp
          if ! git diff --cached --quiet; then
            git commit -q -m "autoevolve: sync symbolic-ai.lisp from $DEFAULT_BRANCH"
          fi

      - name: Remember the previous run's status
        id: before
        run: |
          if [ -f progress/latest-status.txt ]; then
            echo "status=$(tr -cd 'a-z' < progress/latest-status.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "status=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SBCL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sbcl
          sbcl --version

      - name: Run one evolution step
        env:
          SAI_MODE: evolve
        run: sbcl --noinform --non-interactive --no-userinit --load symbolic-ai.lisp

      - name: Guard - only allowlisted files may have changed
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r path; do
            case "$path" in
              knowledge/learned.lisp|PROGRESS.md|progress/*) ;;
              *) echo "::error::Change outside the allowlist: $path"; bad=1 ;;
            esac
          done < <(git status --porcelain --untracked-files=all | cut -c4-)
          exit "$bad"

      - name: Read run status
        id: evolved
        run: echo "status=$(tr -cd 'a-z' < progress/latest-status.txt)" >> "$GITHUB_OUTPUT"

      - name: Validate in a fresh SBCL process
        id: validate
        continue-on-error: true
        env:
          SAI_MODE: validate
        run: sbcl --noinform --non-interactive --no-userinit --load symbolic-ai.lisp

      - name: Discard the change and record the failure
        if: steps.validate.outcome == 'failure' && steps.evolved.outputs.status == 'applied'
        env:
          SAI_MODE: record-failure
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fdq -- progress knowledge PROGRESS.md
          sbcl --noinform --non-interactive --no-userinit --load symbolic-ai.lisp

      - name: Read final status
        id: final
        env:
          PREVIOUS: ${{ steps.before.outputs.status }}
        run: |
          set -euo pipefail
          final="$(tr -cd 'a-z' < progress/latest-status.txt)"
          echo "status=$final" >> "$GITHUB_OUTPUT"
          # Repeated no-op or blocked results are not committed again, so the branch
          # does not fill with identical commits every 5 minutes.
          if [ "$final" = "$PREVIOUS" ] && { [ "$final" = "noop" ] || [ "$final" = "blocked" ]; }; then
            echo "repeat=true" >> "$GITHUB_OUTPUT"
          else
            echo "repeat=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        env:
          REPEAT: ${{ steps.final.outputs.repeat }}
        run: |
          {
            echo "## autoevolve"
            echo
            cat progress/latest.md
            if [ "$REPEAT" = "true" ]; then
              echo "_Same result as the previous run, so nothing was committed._"
              echo
            fi
            echo "Review the branch: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/autoevolve"
            echo "Plain-language overview: PROGRESS.md on the autoevolve branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Skip committing a repeated no-op or blocked result
        if: steps.final.outputs.repeat == 'true'
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fdq -- progress knowledge PROGRESS.md

      - name: Commit and push to autoevolve (never to the default branch)
        run: |
          set -euo pipefail
          git add knowledge/learned.lisp PROGRESS.md progress
          if ! git diff --cached --quiet; then
            git commit -q -m "autoevolve: run ${{ github.run_number }}"
          fi
          if git ls-remote --exit-code --heads origin autoevolve > /dev/null 2>&1; then
            remote="$(git rev-parse origin/autoevolve)"
          else
            remote="none"
          fi
          if [ "$(git rev-parse HEAD)" != "$remote" ]; then
            git push origin HEAD:refs/heads/autoevolve
          else
            echo "Nothing to push."
          fi

      - name: Fail the job if the run was not successful
        if: (steps.final.outputs.status == 'failed' || steps.final.outputs.status == 'blocked') && steps.final.outputs.repeat != 'true'
        env:
          STATUS: ${{ steps.final.outputs.status }}
        run: |
          echo "::error::autoevolve finished with status '$STATUS'. See PROGRESS.md on the autoevolve branch."
          exit 1
